# Cargo workspace for the security/ZK core (Rust).
#
# Status (2026-05-29): the working E2E demo runs on the TypeScript reference implementations
# of vault + proof + verifier (see packages/). These crates hold the production-target core:
# RISC Zero zkVM predicate proofs and hardware-sealed custody. `verifier-core` and `vault`
# carry real, unit-tested pure logic today; the RISC Zero guest/host (`zk-predicates`,
# `prover`) are scaffolded and require the RISC Zero toolchain (`rzup`) to build — they are
# the next slice (see .ai/specs/02-plan.md S3.0). FFI (napi) wiring to TS is also a later slice.
[workspace]
resolver = "2"
members = [
  "crates/vault",
  "crates/verifier-core",
  "crates/zk-predicates",
  "crates/prover",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
aes-gcm = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
