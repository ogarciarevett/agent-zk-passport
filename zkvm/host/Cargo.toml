[package]
name = "passport-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "passport-prover"
path = "src/main.rs"

[lib]
name = "passport_prover"
path = "src/lib.rs"

[dependencies]
passport-methods = { path = "../methods" }
risc0-zkvm = { version = "^3.0.5" }
zk-predicates = { path = "../../crates/zk-predicates" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
