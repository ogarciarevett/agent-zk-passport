name: Toolchain timing
on:
  pull_request:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "34d0f92bb3884d9d5c822b3c0c7f119f91d0945a"
          path: before
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Compare both checkouts on this runner (install excluded)
        shell: bash
        run: |
          failure=0
          for phase in before after; do
            cd "$GITHUB_WORKSPACE/$phase"
            bun install --frozen-lockfile
            if /usr/bin/time -f "$phase typecheck %e seconds" -o "$RUNNER_TEMP/$phase-typecheck.txt" bun run typecheck; then
              cat "$RUNNER_TEMP/$phase-typecheck.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              cat "$RUNNER_TEMP/$phase-typecheck.txt" | tee -a "$GITHUB_STEP_SUMMARY"
              failure=1
            fi
          done
          exit "$failure"
